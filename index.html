<!DOCTYPE html>
<html lang="uz">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Domen sotiladi</title>
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Open Sans", "Helvetica Neue", sans-serif;
            }

            body {
                height: 100vh;
                width: 100vw;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 1rem;
                background-image: url("https://picsum.photos/1600/900?technology");
                background-size: cover;
                background-position: center;
                background-repeat: no-repeat;
                position: relative;
                overflow: hidden;
            }

            body::before {
                content: "";
                position: absolute;
                inset: 0;
                background-color: rgba(34, 25, 14, 0.4);
                z-index: 1;
            }

            .container {
                position: relative;
                z-index: 10;
                display: flex;
                width: 100%;
                max-width: 28rem;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                border-radius: 0.75rem;
                background-color: rgba(255, 255, 255, 0.6);
                padding: 2rem;
                box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
                backdrop-filter: blur(4px);
                font-weight: 500;
            }

            .header {
                margin-bottom: 1.5rem;
                text-align: center;
            }

            .domain {
                margin-bottom: 0.5rem;
                font-size: 1.875rem;
                font-weight: 700;
                color: #3b82f6;
            }

            .subtitle {
                color: #4b5563;
            }

            .divider {
                margin-bottom: 2rem;
                height: 0.125rem;
                width: 100%;
                background-color: #dbeafe;
            }

            .content {
                margin-bottom: 0rem;
                text-align: center;
            }

            .description {
                margin-bottom: 2rem;
                color: #1f2125;
            }

            .button-container {
                position: relative;
                margin: 0 auto 1.5rem;
                overflow: hidden;
                border-radius: 0.5rem;
            }

            .cta-button {
                width: 100%;
                padding: 0.75rem 1.5rem;
                font-size: 1rem;
                font-weight: 500;
                color: white;
                background-color: #3b82f6;
                border: none;
                border-radius: 0.5rem;
                cursor: pointer;
                transition: background-color 0.3s;
                text-align: center;
                text-decoration: none;
                display: inline-block;

                display: flex;
                align-items: center;
                justify-content: center;
                gap: 0.5rem;
            }

            .cta-button:hover {
                background-color: #2563eb;
            }

            .button-line {
                position: absolute;
                bottom: 0;
                left: 0;
                height: 0.25rem;
                width: 100%;
                background-color: #93c5fd;
                transform: translateX(-100%);
                transition: transform 0.7s;
            }

            .button-line.animate {
                transform: translateX(0);
            }

            .contact-info {
                display: grid;
                width: 100%;
                gap: 1rem;
                text-align: center;
            }

            .contact-item {
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 0.5rem;
                color: #3b82f6;
            }

            .contact-item a {
                text-decoration: none;
                color: inherit;
                display: flex;
                align-items: center;
                gap: 0.5rem;
            }

            .icon {
                width: 1rem;
                height: 1rem;
            }
        </style>
    </head>
    <body>

                        Bog'lanish

        <script>
            const buttonContainer = document.getElementById("buttonContainer");
            const buttonLine = document.getElementById("buttonLine");

            buttonContainer.addEventListener("mouseenter", () => {
                buttonLine.classList.add("animate");
            });

            buttonContainer.addEventListener("mouseleave", () => {
                buttonLine.classList.remove("animate");
            });

            const domainName = window.location.hostname;
            document.querySelector(".domain").textContent = domainName;
        </script>
